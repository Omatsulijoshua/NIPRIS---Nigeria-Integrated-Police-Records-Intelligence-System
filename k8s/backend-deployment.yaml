apiVersion: apps/v1
kind: Deployment
metadata:
  name: nipris-backend
  namespace: nipris-prod
  labels:
    app: nipris-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nipris-backend
  template:
    metadata:
      labels:
        app: nipris-backend
    spec:
      containers:
        - name: backend
          image: nipris/backend:latest
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/v1/health/liveness
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health/readiness
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: nipris-backend-service
  namespace: nipris-prod
spec:
  selector:
    app: nipris-backend
  ports:
    - protocol: TCP
      port: 3001
      targetPort: 3001
  type: ClusterIP
