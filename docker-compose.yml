version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nipris_postgres
    restart: always
    environment:
      POSTGRES_USER: nipris_user
      POSTGRES_PASSWORD: nipris_secure_password
      POSTGRES_DB: nipris_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nipris_user -d nipris_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nipris_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: nipris_backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "postgresql://nipris_user:nipris_secure_password@postgres:5432/nipris_db?schema=public"
      REDIS_URL: "redis://redis:6379"
      PORT: 4000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
