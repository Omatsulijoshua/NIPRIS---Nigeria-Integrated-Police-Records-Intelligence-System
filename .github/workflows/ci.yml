name: NIPRIS DevSecOps Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci || npm install

      - name: Validate Prisma Schemas
        run: npx prisma validate --schema=packages/database/prisma/schema.prisma

      - name: Secret Scanning Guard
        run: |
          echo "Scanning for accidental committed secret patterns..."
          ! grep -rn "PRIVATE KEY" . --exclude-dir=node_modules --exclude-dir=.git

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run npm Audit
        run: npm audit --audit-level=high || true
